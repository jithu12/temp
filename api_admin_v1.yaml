openapi: 3.0.0

info:
  title: Dataviz Accounts Admin API
  version: "0.1.0"
  description: >
    Admin-only account lifecycle operations for Dataviz.
    These endpoints trigger deactivation, reactivation, and deletion
    of accounts and their associated workspaces.

servers:
  - url: /admin/v1

paths:

  /accounts/{target_account_id}/{action}:
    patch:
      summary: Activate or deactivate an account
      description: >
        Updates the target account status and cascades the change to
        all associated workspaces.

        Select activate to reactivate the account and all its workspaces.
        Select deactivate to deactivate the account and all its workspaces.

        Caller must be one of the configured admin accounts.
      operationId: account_update_status
      x-openapi-router-controller: dataviz_api.apis.v1.accounts_controller
      parameters:
        - $ref: "#/components/parameters/targetAccountId"
        - $ref: "#/components/parameters/action"
      responses:
        "202":
          description: Account status update requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        "403":
          description: Caller is not authorized to perform admin actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        "404":
          description: Target account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        "409":
          description: Account is not in a state that allows this transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
      security:
        - oauth2_accessCode:
            - dataviz:readwrite
      tags:
        - accounts

  /accounts/{target_account_id}:
    delete:
      summary: Request deletion of an account
      description: >
        Soft deletes the target account and all its associated workspaces.
        Records remain in the database with status DELETED.
        Caller must be one of the configured admin accounts.
      operationId: account_delete
      x-openapi-router-controller: dataviz_api.apis.v1.accounts_controller
      parameters:
        - $ref: "#/components/parameters/targetAccountId"
      responses:
        "202":
          description: Account deletion requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "403":
          description: Caller is not authorized to perform admin actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        "404":
          description: Target account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        "409":
          description: Account is not in a state that allows deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
      security:
        - oauth2_accessCode:
            - dataviz:readwrite
      tags:
        - accounts

  /accounts/{target_account_id}/status:
    get:
      summary: Get current status of an account
      description: >
        Returns the current lifecycle status of the specified account.
        Available to any authenticated user.
      operationId: account_status
      x-openapi-router-controller: dataviz_api.apis.v1.accounts_controller
      parameters:
        - $ref: "#/components/parameters/targetAccountId"
      responses:
        "200":
          description: Account status retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatus"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
      security:
        - oauth2_accessCode:
            - dataviz:read
            - dataviz:readwrite
      tags:
        - accounts

components:

  parameters:
    targetAccountId:
      name: target_account_id
      in: path
      required: true
      description: >
        The owner_account_id of the account to act on.
      schema:
        type: string
        format: uuid
      example: 00000000-1111-2222-3333-444444444444

    action:
      name: action
      in: path
      required: true
      description: >
        The action to perform on the account.
        activate — reactivates the account and all its workspaces.
        deactivate — deactivates the account and all its workspaces.
      schema:
        type: string
        enum:
          - activate
          - deactivate
      example: deactivate

  securitySchemes:
    oauth2_accessCode:
      type: oauth2
      x-tokenInfoFunc: platform_api.token_check
      x-scopeValidateFunc: platform_api.validate_sg_iamaas_scope
      flows:
        authorizationCode:
          authorizationUrl: https://oauth2.accesscontrol.cloud.socgen/v3/oauth2/authorize
          tokenUrl: https://oauth2.accesscontrol.cloud.socgen/v3/oauth2/access_token
          scopes:
            dataviz:read: Grant read access
            dataviz:readwrite: Write scopes on resources
            dataviz:read_resources: Grant read access to resource types

  schemas:

    Account:
      type: object
      description: Account details returned by lifecycle operations
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
          description: Account identifier
          example: 00000000-1111-2222-3333-444444444444
        owner_account_id:
          type: string
          format: uuid
          description: Owner account identifier
        status:
          type: string
          description: Account status after the operation
          example: INACTIVE
        name:
          type: string
          description: Account name

    AccountStatus:
      type: object
      description: Current status of the account including workspace details
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
          description: Account identifier
        owner_account_id:
          type: string
          format: uuid
          description: Owner account identifier
        status:
          type: string
          description: Current account status
          example: ACTIVE
        name:
          type: string
          description: Account name
        workspace_count:
          type: integer
          description: Total number of workspaces under this account
          example: 3
        workspaces:
          type: array
          description: List of workspaces under this account
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Workspace identifier
              name:
                type: string
                description: Workspace name
              status:
                type: string
                description: Current workspace status
                example: ACTIVE

    ErrorModel:
      type: object
      description: Error response
      properties:
        error:
          type: string
          example: Account is already inactive. No changes were made.
        detail:
          type: string
          example: Account 'xxx' is already inactive.
        code:
          type: string
          example: ACCOUNT_ALREADY_INACTIVE

tags:
  - name: accounts
    description: Account lifecycle operations
